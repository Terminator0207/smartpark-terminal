name: CI Checks

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Verify Index File Exists
      run: |
        if [ -f index.html ]; then
          echo "index.html exists!"
        else
          echo "Error: index.html missing!" && exit 1
        fi
