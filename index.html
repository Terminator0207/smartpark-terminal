<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartPark - Facility Manager</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #22c55e;
      --danger: #ef4444;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .wrapper { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; padding: 20px 0; border-bottom: 1px solid #334155; margin-bottom: 30px; }
    header h1 { margin: 0; font-size: 28px; color: var(--text); }
    header p { color: #94a3b8; margin: 5px 0 0 0; }
    
    .dashboard { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    .panel { background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    input, select { width: 100%; background: #0f172a; border: 1px solid #334155; color: var(--text); padding: 10px; border-radius: 6px; box-sizing: border-box; }
    
    button.btn-add { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button.btn-add:hover { opacity: 0.9; }

    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .slot-card { background: #0f172a; border: 2px dashed #334155; border-radius: 8px; padding: 15px; text-align: center; }
    .slot-card.occupied { border-style: solid; border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .slot-card .slot-number { font-size: 12px; color: #94a3b8; font-weight: bold; }
    .slot-card .status { font-weight: bold; margin: 8px 0; font-size: 14px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; color: #94a3b8; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    td { padding: 12px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    
    .btn-checkout { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>SmartPark Terminal</h1>
      <p>Automated Parking Lot Operations Control</p>
    </header>

    <div class="dashboard">
      <div class="panel">
        <h3 style="margin-top:0;">Check-In Vehicle</h3>
        <form id="checkInForm">
          <div class="form-group">
            <label>Plate Number</label>
            <input type="text" id="plateNo" placeholder="e.g. LEB-8902" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="vCategory">
              <option value="Sedan">Sedan / Hatchback</option>
              <option value="SUV">SUV / Truck</option>
              <option value="Motorcycle">Motorcycle</option>
            </select>
          </div>
          <div class="form-group">
            <label>Assigned Slot</label>
            <select id="slotSelect">
              <option value="A-101">Slot A-101</option>
              <option value="A-102">Slot A-102</option>
              <option value="A-103">Slot A-103</option>
              <option value="A-104">Slot A-104</option>
            </select>
          </div>
          <button type="submit" class="btn-add">Park Vehicle</button>
        </form>
      </div>

      <div class="panel">
        <h3 style="margin-top:0;">Active Slots Overview</h3>
        <div class="slots-grid" id="slotsVisual">
        </div>

        <h3>Active Tickets</h3>
        <table>
          <thead>
            <tr>
              <th>Plate</th>
              <th>Category</th>
              <th>Slot</th>
              <th>Time In</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="ticketLogs">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const availableSlots = ["A-101", "A-102", "A-103", "A-104"];
    let records = [];

    const form = document.getElementById('checkInForm');
    const logs = document.getElementById('ticketLogs');
    const visual = document.getElementById('slotsVisual');

    function renderSlots() {
      visual.innerHTML = '';
      availableSlots.forEach(slot => {
        const occupied = records.find(r => r.slot === slot);
        const div = document.createElement('div');
        div.className = `slot-card ${occupied ? 'occupied' : ''}`;
        div.innerHTML = `
          <div class="slot-number">${slot}</div>
          <div class="status" style="color: ${occupied ? '#ef4444' : '#22c55e'}">
            ${occupied ? occupied.plate : 'VACANT'}
          </div>
        `;
        visual.appendChild(div);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const plate = document.getElementById('plateNo').value;
      const category = document.getElementById('vCategory').value;
      const slot = document.getElementById('slotSelect').value;

      if (records.some(r => r.slot === slot)) {
        alert('Selected slot is currently occupied!');
        return;
      }

      const timeIn = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      records.push({ id: Date.now(), plate, category, slot, timeIn });

      form.reset();
      updateUI();
    });

    function checkout(id) {
      records = records.filter(r => r.id !== id);
      updateUI();
    }

    function updateUI() {
      renderSlots();
      logs.innerHTML = '';
      records.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${r.plate}</strong></td>
          <td>${r.category}</td>
          <td>${r.slot}</td>
          <td>${r.timeIn}</td>
          <td><button class="btn-checkout" onclick="checkout(${r.id})">Exit & Pay</button></td>
        `;
        logs.appendChild(tr);
      });
    }

    renderSlots();
  </script>
</body>
</html>
